query GetQuestItems(
    $rating: RangeInput,
    $radius: Double,
    $originCoordinates: CoordinateInput
) {
    questItems(
        rating: $rating
        radius: $radius
        originCoordinates: $originCoordinates
    ) {
        title
        description
        clue
        hint
        rating
        coordinates {
            latitude
            longitude
        }
        endGameAssets {
            endGameDetail
            endGameImageID
        }
    }
}